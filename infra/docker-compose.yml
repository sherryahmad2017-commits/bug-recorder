name: reproflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reproflow
      POSTGRES_PASSWORD: reproflow_dev_password
      POSTGRES_DB: reproflow
    ports:
      - "5432:5432"
    volumes:
      - reproflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reproflow -d reproflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - reproflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reproflow
      MINIO_ROOT_PASSWORD: reproflow_dev_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - reproflow_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job that creates the dev bucket on first startup so the backend
  # never has to be granted bucket-creation privileges at runtime.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 reproflow reproflow_dev_password &&
      mc mb -p local/reproflow-dev &&
      mc anonymous set none local/reproflow-dev
      "

volumes:
  reproflow_postgres_data:
  reproflow_redis_data:
  reproflow_minio_data:
